MaintainerNotes: |-
  Kotlin + Jetpack Compose + KSP/Room. Builds with the builder JDK (21).
  CalDAV client is pulled from JitPack: com.github.bitfireAT:dav4jvm.
  Store listing, changelogs, and phone screenshots are in the app repo under
  fastlane/metadata/android/ for locales en-US, es-ES, and it-IT.
  Demo/seed code is debug-only and not included in release builds.
  Release builds are left unsigned here so fdroidserver can sign them
  (do not pass -PuseDebugKeystore on the F-Droid builder).

